<!doctype html>
<!--
  Open Graph image source (1200×630). This is the editable spec/component for Prism's
  social card. Render to public/og.png (the file referenced by <meta property="og:image">).
  Regenerate after edits, e.g. with a headless browser screenshot at 1200×630.
  F5.6 is not embeddable, so a tight bold grotesk fallback approximates the display face.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
      }
      .card {
        width: 1200px;
        height: 630px;
        padding: 84px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: radial-gradient(120% 90% at 12% -12%, #0f3330 0%, #0b2624 46%, #071b1a 100%);
        color: #f3f8f5;
        font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .wordmark {
        font-weight: 800;
        letter-spacing: -0.03em;
        font-size: 34px;
        text-transform: uppercase;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 20px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8fb3aa;
      }
      h1 {
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 0.9;
        font-size: 132px;
        text-transform: uppercase;
      }
      h1 .mint {
        color: #d8ece3;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sub {
        font-size: 26px;
        color: rgba(233, 244, 239, 0.78);
        max-width: 720px;
        line-height: 1.35;
      }
      .pill {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 18px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #071b1a;
        background: #3fb69a;
        padding: 12px 20px;
        border-radius: 999px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="wordmark">Prism</div>
        <div class="eyebrow">Human payments · Monad</div>
      </div>
      <h1>Pay people.<br /><span class="mint">Not wallets.</span></h1>
      <div class="foot">
        <div class="sub">
          Send and request dollars through contacts, handles and payment links. Monad settles underneath.
        </div>
        <div class="pill">Get Prism ↗</div>
      </div>
    </div>
  </body>
</html>
